<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recibo Green Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Source+Sans+3&display=swap" rel="stylesheet">
<link rel="stylesheet" href=".//kimi.css">
</head>
<body>
<div class="recibo">
  <div class="header">
    <div class="logo">GREEN <span style="color:#4a9;font-size:32px">&#9670;</span> BLUE
      <span>aquamaine</span>
      <small>Hecho y prevención en la funcionalidad física</small>
    </div>
    <div class="header-right">
      <div class="servicios">REHABILITACIÓN <input type="checkbox"> ENTRETENIMIENTO <input type="checkbox"><br>MASAJES <input type="checkbox"> NATACIÓN <input type="checkbox"></div>
      <div class="telefonos">&#9742; 318 868 8008 / 310 740 6038</div>
    </div>
  </div>
  <div class="datos">
    <div class="fechas"><label>Fecha Inicio</label><input><label>Fecha Finalización</label><input></div>
    <div class="personal">
      <label>Señor (es):</label><input>
      <label>Teléfono:</label><input>
      <label>Ciudad:</label><input>
      <label>Edad:</label><input>
      <label>Dirección:</label><input>
      <label>Peso:</label><input>
      <label>Talla:</label><input>
    </div>
    <div class="recibo-num"><div class="titulo">RECIBO</div><div class="n">Nº</div><div class="numero">0476</div></div>
  </div>
  <table class="tabla">
    <tr><th>DESCRIPCIÓN</th><th>PPL</th><th>VR TOTAL</th></tr>
    <tr><td class="desc"></td><td></td><td></td></tr>
    <tr><td style="text-align:right;border-right:none">TOTAL</td><td style="border-left:none;border-right:none"></td><td style="border-left:none">$</td></tr>
  </table>
  <div class="obs"><label>OBSERVACIONES</label></div>
  <div class="firmas">
    <div class="firma"><div class="linea">FIRMA DEL INSTRUCTOR</div></div>
    <div class="firma"><div class="linea">FIRMA DEL USUARIO</div></div>
  </div>
</div>
</body>
</html>
