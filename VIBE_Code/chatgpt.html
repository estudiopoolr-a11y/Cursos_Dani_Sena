<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recibo</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Source+Sans+3&display=swap" rel="stylesheet">
<link rel="stylesheet" href=".//chatgpt.css">
</head>
<body>

<div class="recibo">

    <div class="top">
        <div>
            <div class="logo">GREEN & BLUE</div>
            <small>aquamarine</small><br>
            <small>Éxito y Privacidad de la Vanidad.</small>
        </div>

        <div>
            REHABILITACIÓN ☐<br>
            ENTRETENIMIENTO ☐<br>
            MASAJES ☐<br>
            NATACIÓN ☐
        </div>

        <div>
            <b>RECIBO</b><br>
            Nº <span style="color:red;">0476</span>
        </div>
    </div>

    <div class="row">
        Señor(es): <div class="line"></div>
    </div>

    <div class="row">
        Teléfono: <div class="line"></div>
        Ciudad: <div class="line"></div>
        Edad: <div class="line"></div>
    </div>

    <div class="row">
        Dirección: <div class="line"></div>
        Peso: <div class="line"></div>
        Talla: <div class="line"></div>
    </div>

    <div class="desc"></div>

    <div class="obs"></div>

    <div class="firmas">
        <div>_________________<br>FIRMA DEL INSTRUCTOR</div>
        <div>_________________<br>FIRMA DEL USUARIO</div>
    </div>

</div>

</body>
</html>
