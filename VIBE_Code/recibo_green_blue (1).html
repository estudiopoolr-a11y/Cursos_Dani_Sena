<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recibo Green & Blue</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Source+Sans+3&display=swap" rel="stylesheet">
<link rel="stylesheet" href=".//recibecom.css">

</head>
<body>
<div class="recibo">

  <header>
    <div class="brand">
      <h1>GREEN ♻ <span>BLUE</span></h1>
      <em>a g u a m a r i n e</em>
      <small>Efectos y prevención en la funcionalidad física</small>
      <p>☎ 318 868 8008 / 310 740 6038</p>
    </div>
    <div class="meta">
      <div class="checks">
        <label><input type="checkbox"> Rehabilitación</label>
        <label><input type="checkbox"> Entretenimiento</label>
        <label><input type="checkbox"> Masajes</label>
        <label><input type="checkbox"> Natación</label>
      </div>
      <div class="num">
        <b>Recibo N<sup>o</sup></b>
        <span>0 4 7 6</span>
      </div>
    </div>
  </header>

  <hr>

  <div class="fields">
    <div class="f"><label>Señor(es):</label><div class="line"></div></div>
    <div class="row r2">
      <div class="f"><label>Ciudad:</label><div class="line"></div></div>
      <div class="f"><label>Edad:</label><div class="line"></div></div>
    </div>
    <div class="row r3">
      <div class="f"><label>Dirección:</label><div class="line"></div></div>
      <div class="f"><label>Peso:</label><div class="line"></div></div>
      <div class="f"><label>Talla:</label><div class="line"></div></div>
    </div>
    <div class="row r4">
      <div class="f"><label>Teléfono:</label><div class="line"></div></div>
      <div class="fechas">
        <div class="frow"><label>Fecha Inicio</label><div class="boxes"><span></span><span></span><span></span></div></div>
        <div class="frow"><label>Fecha Finalización</label><div class="boxes"><span></span><span></span><span></span></div></div>
      </div>
    </div>
  </div>

  <section>
    <div class="thead">Descripción</div>
    <table>
      <tr><th style="width:55%">Descripción</th><th style="width:15%">PPL.</th><th style="width:15%">Vr. Total</th><th style="width:15%">Total</th></tr>
      <tr><td>&nbsp;</td><td></td><td></td><td></td></tr>
      <tr><td>&nbsp;</td><td></td><td></td><td></td></tr>
      <tr><td>&nbsp;</td><td></td><td></td><td></td></tr>
      <tr><td>&nbsp;</td><td></td><td></td><td></td></tr>
    </table>
    <div class="total-row"><span>Total</span><span>$</span><span class="amt"></span></div>
  </section>

  <div class="obs">
    <b>Observaciones</b>
    <p></p>
  </div>

  <div class="sigs">
    <div class="sig"><hr><p>Firma del Instructor</p></div>
    <div class="sig"><hr><p>Firma del Usuario</p></div>
  </div>

</div>
</body>
</html>
